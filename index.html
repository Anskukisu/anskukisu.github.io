<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animated Triangle Lattice</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080b14;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>
<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width;
let height;

const spacing = 90;
const motion = 18;
const speed = 0.00035;

let vertices = [];
let triangles = [];

/*
 * Resize canvas for high-DPI screens.
 */
function resize() {
  const dpr = window.devicePixelRatio || 1;

  width = window.innerWidth;
  height = window.innerHeight;

  canvas.width = width * dpr;
  canvas.height = height * dpr;

  canvas.style.width = width + "px";
  canvas.style.height = height + "px";

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  createLattice();
}


/*
 * Create the triangular lattice.
 */
function createLattice() {
  vertices = [];
  triangles = [];

  const rowHeight = spacing * Math.sqrt(3) / 2;

  const cols = Math.ceil(width / spacing) + 3;
  const rows = Math.ceil(height / rowHeight) + 3;

  /*
   * Create all shared vertices.
   */
  for (let row = -2; row < rows; row++) {
    for (let col = -2; col < cols; col++) {

      const x =
        col * spacing +
        (row % 2) * spacing / 2;

      const y = row * rowHeight;

      vertices.push({
        x,
        y,

        /*
         * Each vertex gets its own phase so
         * neighboring vertices don't move identically.
         */
        phaseX: Math.random() * Math.PI * 2,
        phaseY: Math.random() * Math.PI * 2,

        speedX: 0.7 + Math.random() * 0.6,
        speedY: 0.7 + Math.random() * 0.6
      });
    }
  }

  /*
   * Convert the vertex grid into triangles.
   */
  for (let row = 0; row < rows - 1; row++) {
    for (let col = 0; col < cols - 1; col++) {

      const i = row * cols + col;

      if (row % 2 === 0) {
        triangles.push([i, i + 1, i + cols]);
        triangles.push([i + 1, i + cols + 1, i + cols]);
      } else {
        triangles.push([i, i + 1, i + cols + 1]);
        triangles.push([i, i + 1 + cols + 1, i + cols]);
      }
    }
  }
}


/*
 * Calculate the current position of a vertex.
 */
function getVertex(v, time) {
  return {
    x: v.x +
       Math.sin(time * speed * v.speedX + v.phaseX) * motion,

    y: v.y +
       Math.cos(time * speed * v.speedY + v.phaseY) * motion
  };
}


/*
 * Draw one triangle.
 */
function drawTriangle(a, b, c, time) {

  const A = getVertex(a, time);
  const B = getVertex(b, time);
  const C = getVertex(c, time);

  /*
   * Use the triangle's center to determine
   * its gradient.
   */
  const centerX = (A.x + B.x + C.x) / 3;
  const centerY = (A.y + B.y + C.y) / 3;

  const gradient = ctx.createLinearGradient(
    A.x,
    A.y,
    C.x,
    C.y
  );

  /*
   * Change these colors to whatever palette
   * you want.
   */
  gradient.addColorStop(0, "#182b5c");
  gradient.addColorStop(0.5, "#315ca8");
  gradient.addColorStop(1, "#6b4fb3");

  ctx.beginPath();

  ctx.moveTo(A.x, A.y);
  ctx.lineTo(B.x, B.y);
  ctx.lineTo(C.x, C.y);

  ctx.closePath();

  ctx.fillStyle = gradient;
  ctx.fill();
}


/*
 * Animation loop.
 */
function animate(time) {

  ctx.clearRect(0, 0, width, height);

  /*
   * Dark background.
   */
  ctx.fillStyle = "#080b14";
  ctx.fillRect(0, 0, width, height);

  /*
   * Draw every triangle.
   */
  for (const triangle of triangles) {

    const [a, b, c] = triangle;

    drawTriangle(
      vertices[a],
      vertices[b],
      vertices[c],
      time
    );
  }

  requestAnimationFrame(animate);
}


window.addEventListener("resize", resize);

resize();
requestAnimationFrame(animate);
</script>

</body>
</html>
